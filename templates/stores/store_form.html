{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block crumb %}<a href="{% url 'stores:store_list' %}">Stores</a> <i class="bi bi-chevron-right"></i> {{ title }}{% endblock %}
{% block content %}
<div class="page-header"><div><h1>{{ title }}</h1></div></div>
<div class="card" style="max-width:560px"><div class="card-body">
  <form method="post">{% csrf_token %}
    {% for f in form %}
      <div class="form-group">
        <label class="form-label">{{ f.label }}</label>
        {{ f }}
        {% if f.errors %}<div class="form-error">{{ f.errors|striptags }}</div>{% endif %}
      </div>
    {% endfor %}
    <div class="flex gap-2">
      <button class="btn btn-primary"><i class="bi bi-check2"></i> Save</button>
      <a class="btn btn-ghost" href="{% url 'stores:store_list' %}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
